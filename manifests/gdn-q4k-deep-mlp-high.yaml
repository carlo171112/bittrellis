schema: bittrellis/manifest@2
track: HPC-01
name: gdn-q4k-deep-mlp-high
description: >
  Q4_K on deep recurrent projections (layers 32-63) and only the highest MLP
  blocks (layers 48-63). #5 kept 4K prefill at 14,302 tok/s; #10 added MLP
  32-63 and fell to 11,320 while decode rose to 96.1. The highest MLP blocks
  are the faster half of that cost. Attention, lm_head, and layers 0-47 of
  the MLP stay NVFP4.
authors: [carlo171112]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    layers: "32-63"
    format: Q4_K
  - match: "L*.mlp"
    layers: "48-63"
    format: Q4_K
