schema: bittrellis/manifest@2
track: HPC-01
name: gdn-q4k-skip0-mlp-32-47
description: >
  Q4_K on every recurrent projection in layers 1-63 and on MLP blocks 32-47.
  Layer 0 stays NVFP4. MLP layers 1-31 and 48-63 stay NVFP4. #15 put Q4_K on
  MLP 1-63 and kept 4K prefill at 8,811 tok/s. #29 dropped only 48-63 and
  reached 9,585, inside the noise of that point. #24 put Q4_K on MLP 24-47
  and reached 11,004 tok/s with the holdout passing. This window is the deep
  half of that band, without attention. Attention and lm_head stay NVFP4.
authors: [carlo171112]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    layers: "1-63"
    format: Q4_K
  - match: "L*.mlp"
    layers: "32-47"
    format: Q4_K
